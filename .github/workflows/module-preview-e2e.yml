name: Module preview E2E

on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: Compact module preview request JSON
        required: true
        type: string
      correlation_id:
        description: Optional caller correlation identifier
        required: false
        default: ""
        type: string
      callback_metadata_json:
        description: Optional opaque callback metadata (recorded only; never invoked)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: module-preview-e2e-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Verify, materialize, and test producer preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBRARY_REPOSITORY: shirubasoft/aspire-modular-apphosts
      LIBRARY_COMMIT: c2a01306113ccf27a7489a82b143dd8d7cb1d02c
      TRUSTED_WORKFLOW_REF: refs/heads/codex/tool-owned-preview-materialization

    steps:
      - name: Check out trusted consumer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Enforce trusted workflow ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "$TRUSTED_WORKFLOW_REF" ]]; then
            echo "This trusted workflow must run from $TRUSTED_WORKFLOW_REF." >&2
            exit 1
          fi

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301

      - name: Install pinned Aspire CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_path="$RUNNER_TEMP/aspire-cli"
          dotnet tool install Aspire.Cli --tool-path "$cli_path" --version 13.4.6
          echo "$cli_path" >> "$GITHUB_PATH"

      - name: Check out trusted preview implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.LIBRARY_REPOSITORY }}
          ref: ${{ env.LIBRARY_COMMIT }}
          path: modular-apphosts
          fetch-depth: 1
          persist-credentials: false

      - name: Pack and install pinned preview implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics .preview-feed .tool-feed

          actual_library_commit=$(git -C modular-apphosts rev-parse HEAD)
          if [[ "$actual_library_commit" != "$LIBRARY_COMMIT" ]]; then
            echo "Library checkout mismatch: expected $LIBRARY_COMMIT, got $actual_library_commit." >&2
            exit 1
          fi

          library_version="1.2.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          tool_version="0.0.0-preview.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          dotnet restore \
            modular-apphosts/src/Aspire.Hosting.ModularAppHosts/Aspire.Hosting.ModularAppHosts.csproj \
            --nologo \
            2>&1 | tee diagnostics/modular-apphosts-restore.log
          dotnet pack \
            modular-apphosts/src/Aspire.Hosting.ModularAppHosts/Aspire.Hosting.ModularAppHosts.csproj \
            --configuration Release \
            --no-restore \
            --output .preview-feed \
            -p:PackageVersion="$library_version" \
            -p:Version="$library_version" \
            --nologo \
            2>&1 | tee diagnostics/modular-apphosts-pack.log

          dotnet restore \
            modular-apphosts/src/Aspire.Hosting.ModularAppHosts.Tool/Aspire.Hosting.ModularAppHosts.Tool.csproj \
            --nologo \
            2>&1 | tee diagnostics/preview-tool-restore.log
          dotnet pack \
            modular-apphosts/src/Aspire.Hosting.ModularAppHosts.Tool/Aspire.Hosting.ModularAppHosts.Tool.csproj \
            --configuration Release \
            --no-restore \
            --output .tool-feed \
            -p:PackageVersion="$tool_version" \
            -p:Version="$tool_version" \
            --nologo \
            2>&1 | tee diagnostics/preview-tool-pack.log

          tool_path="$RUNNER_TEMP/modular-apphosts-tool"
          dotnet tool install \
            Shirubasoft.Aspire.ModularAppHosts.Tool \
            --tool-path "$tool_path" \
            --version "$tool_version" \
            --source "$GITHUB_WORKSPACE/.tool-feed" \
            2>&1 | tee diagnostics/preview-tool-install.log
          echo "$tool_path" >> "$GITHUB_PATH"
          echo "ModularAppHostsVersion=$library_version" >> "$GITHUB_ENV"

          library_package=".preview-feed/Shirubasoft.Aspire.ModularAppHosts.${library_version}.nupkg"
          tool_package=".tool-feed/Shirubasoft.Aspire.ModularAppHosts.Tool.${tool_version}.nupkg"
          test -f "$library_package"
          test -f "$tool_package"
          jq -n \
            --arg repository "$LIBRARY_REPOSITORY" \
            --arg commit "$LIBRARY_COMMIT" \
            --arg libraryVersion "$library_version" \
            --arg librarySha256 "$(sha256sum "$library_package" | awk '{print $1}')" \
            --arg toolVersion "$tool_version" \
            --arg toolSha256 "$(sha256sum "$tool_package" | awk '{print $1}')" \
            '{repository: $repository, commit: $commit, library: {version: $libraryVersion, sha256: $librarySha256}, tool: {version: $toolVersion, sha256: $toolSha256}}' \
            > diagnostics/preview-toolchain.json

      - name: Prepare request metadata
        shell: bash
        env:
          INPUT_MANIFEST_JSON: ${{ inputs.manifest_json }}
          INPUT_CORRELATION_ID: ${{ inputs.correlation_id }}
          INPUT_CALLBACK_METADATA_JSON: ${{ inputs.callback_metadata_json }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/module-preview.input.json"
          printf '%s' "$INPUT_MANIFEST_JSON" > "$input_path"
          echo "MODULE_PREVIEW_INPUT=$input_path" >> "$GITHUB_ENV"

          if (( ${#INPUT_CORRELATION_ID} > 128 )) ||
             [[ "$INPUT_CORRELATION_ID" =~ [^A-Za-z0-9._:/-] ]]; then
            echo "correlation_id must be at most 128 safe characters." >&2
            exit 1
          fi

          callback_path="$RUNNER_TEMP/callback-metadata.json"
          if [[ -z "$INPUT_CALLBACK_METADATA_JSON" ]]; then
            printf 'null\n' > "$callback_path"
          else
            if (( ${#INPUT_CALLBACK_METADATA_JSON} > 4096 )); then
              echo "callback_metadata_json must be at most 4096 characters." >&2
              exit 1
            fi
            printf '%s' "$INPUT_CALLBACK_METADATA_JSON" > "$callback_path"
            jq -e 'type == "object"' "$callback_path" > /dev/null
          fi

          jq -n \
            --arg correlationId "$INPUT_CORRELATION_ID" \
            --slurpfile callback "$callback_path" \
            '{correlationId: ($correlationId | select(length > 0) // null), callback: $callback[0]}' \
            > diagnostics/request-metadata.json

      - name: Verify preview request offline
        shell: bash
        run: |
          set -euo pipefail
          dotnet modular-apphosts preview verify \
            --manifest "$MODULE_PREVIEW_INPUT" \
            --policy .github/module-preview-policy.json \
            --output diagnostics/validated-manifest.json \
            2>&1 | tee diagnostics/preview-verify.log

      - name: Materialize policy-approved preview
        shell: bash
        run: |
          set -euo pipefail
          dotnet modular-apphosts preview materialize \
            --manifest diagnostics/validated-manifest.json \
            --policy .github/module-preview-policy.json \
            --work-directory "$RUNNER_TEMP/module-preview-work" \
            --package-feed "$GITHUB_WORKSPACE/.preview-feed" \
            --resolution "$GITHUB_WORKSPACE/diagnostics/resolved-preview.json" \
            --consumer-repository "https://github.com/${GITHUB_REPOSITORY}.git" \
            --consumer-commit "$GITHUB_SHA" \
            --nuget-config "$GITHUB_WORKSPACE/nuget.config" \
            --property ModularAppHostsVersion="$ModularAppHostsVersion" \
            --github-env "$GITHUB_ENV" \
            2>&1 | tee diagnostics/preview-materialize.log

      - name: Restore consumer against materialized packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore \
            src/Preview.Consumer.AppHost/Preview.Consumer.AppHost.csproj \
            --configfile "$GITHUB_WORKSPACE/nuget.config" \
            --no-cache \
            --nologo \
            2>&1 | tee diagnostics/consumer-restore.log

      - name: Start preview AppHost
        shell: bash
        run: |
          set -euo pipefail
          aspire start \
            --apphost src/Preview.Consumer.AppHost/Preview.Consumer.AppHost.csproj \
            --non-interactive \
            2>&1 | tee diagnostics/aspire-start.log

      - name: Wait for preview resources
        shell: bash
        run: |
          set -euo pipefail
          aspire wait preview-producer-api \
            --apphost src/Preview.Consumer.AppHost/Preview.Consumer.AppHost.csproj \
            --timeout 180 \
            --non-interactive \
            2>&1 | tee diagnostics/aspire-wait-api.log
          aspire wait preview-producer-sidecar \
            --apphost src/Preview.Consumer.AppHost/Preview.Consumer.AppHost.csproj \
            --timeout 180 \
            --non-interactive \
            2>&1 | tee diagnostics/aspire-wait-sidecar.log

      - name: Assert preview responses
        shell: bash
        run: |
          set -euo pipefail
          aspire describe preview-producer-api \
            --apphost src/Preview.Consumer.AppHost/Preview.Consumer.AppHost.csproj \
            --format Json \
            --non-interactive \
            > diagnostics/api-description.json
          aspire describe preview-producer-sidecar \
            --apphost src/Preview.Consumer.AppHost/Preview.Consumer.AppHost.csproj \
            --format Json \
            --non-interactive \
            > diagnostics/sidecar-description.json

          api_url=$(jq -r '[.resources[].urls[] | select(.name == "http") | .url][0] // empty' diagnostics/api-description.json)
          sidecar_url=$(jq -r '[.resources[].urls[] | select(.name == "http") | .url][0] // empty' diagnostics/sidecar-description.json)
          test -n "$api_url"
          test -n "$sidecar_url"
          curl --fail --show-error --silent "${api_url%/}/" > diagnostics/preview-response.txt
          curl --fail --show-error --silent "${sidecar_url%/}/" > diagnostics/sidecar-response.html

          actual_response=$(tr -d '\r\n' < diagnostics/preview-response.txt)
          if [[ "$actual_response" != "preview-from-feature-branch" ]]; then
            echo "Unexpected preview response: $actual_response" >&2
            exit 1
          fi
          if ! grep -Fq '<title>Welcome to nginx!</title>' diagnostics/sidecar-response.html; then
            echo "The preview sidecar did not return the expected nginx page." >&2
            exit 1
          fi

      - name: Collect Aspire diagnostics
        if: always()
        shell: bash
        run: |
          if command -v aspire > /dev/null 2>&1; then
            aspire ps \
              --apphost src/Preview.Consumer.AppHost/Preview.Consumer.AppHost.csproj \
              --format Json \
              --include-hidden \
              --non-interactive \
              > diagnostics/aspire-ps.json 2> diagnostics/aspire-ps.stderr || true
          fi

      - name: Stop preview AppHost
        if: always()
        shell: bash
        run: |
          if command -v aspire > /dev/null 2>&1; then
            aspire stop \
              --apphost src/Preview.Consumer.AppHost/Preview.Consumer.AppHost.csproj \
              --non-interactive \
              2>&1 | tee diagnostics/aspire-stop.log || true
          fi

      - name: Upload validated request and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-preview-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
